name: baqy
description: "Baqy personal monthly expense tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  drift: ^2.35.3
  sqlcipher_flutter_libs: ^0.7.0+eol
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  speech_to_text: ^7.5.0
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  wakelock_plus: ^1.8.2
  record: ^7.1.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.6
  timezone: ^0.10.1
  firebase_core: 5.2.0
  firebase_auth: 7.1.0
  cloud_firestore: 7.2.0
  google_sign_in: 7.2.0
  url_launcher: 6.3.3
  crypto: ^3.0.6
  local_auth: ^3.0.2
  pdf: ^3.13.1
  excel_community: ^2.6.2
  share_plus: ^13.3.1

dependency_overrides:
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - .env


  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
